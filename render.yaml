# Render blueprint. `render.yaml` is read on first deploy from a repo.
#
# WARNING about the free tier: a free Render web service spins down after 15
# minutes of inactivity and takes roughly 50 seconds to wake. That is a far
# worse demo experience than Neon's sub-second database resume. For anything
# people will click on, use the Starter plan.
services:
  - type: web
    name: ipotracker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/release.sh
    plan: starter          # `free` spins down after 15 min -- see the note above
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        sync: false        # from Neon
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require     # Neon rejects plaintext; local default 'prefer' will not do
      - key: DB_POOL_MIN_SIZE
        value: "0"         # a held connection stops Neon autosuspending
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: CORS_ORIGINS
        sync: false        # the Vercel URL, as a JSON list
      - key: MENTION_HASH_SALT
        sync: false
      - key: SEC_USER_AGENT
        sync: false

  - type: worker
    name: ipotracker-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.worker
    plan: starter
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: DB_POOL_MIN_SIZE
        value: "0"
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: MENTION_HASH_SALT
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: KEEP_WARM_MINUTES
        value: "0"         # set to 5 for the days around a demo, then back to 0
