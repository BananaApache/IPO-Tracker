[project]
name = "ipotracker"
version = "0.1.0"
description = "IPO surveillance and anomaly detection over SEC EDGAR filings and social chatter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
    "apscheduler>=3.10,<4",
]

# `package = false` keeps uv from trying to build/install this repo as a wheel.
# `backend` is imported off PYTHONPATH instead, which keeps the Dockerfile simple.
[tool.uv]
package = false

# Lets `fastapi dev` / `fastapi run` find the app with no path argument.
[tool.fastapi]
entrypoint = "backend.main:app"

[tool.ruff]
target-version = "py313"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Research module only (research/). NOT installed by the deployed image, which
# runs `uv sync --locked --no-dev` and so takes only [project.dependencies].
# Kept out of the main dependency list on purpose: the API and worker must not
# grow a pandas/matplotlib dependency for the sake of a notebook.
research = [
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

