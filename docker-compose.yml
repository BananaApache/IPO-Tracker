services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipo}
      POSTGRES_USER: ${POSTGRES_USER:-ipo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipo}
    ports:
      # Published so psql and the migration runner work from the host too.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation so the shell inside the container
      # expands these, not compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies pending migrations, exits 0, and gates the api service.
  # Kept separate from the api container so a failed migration is a visibly
  # failed step rather than a crash loop inside the server's entrypoint.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.migrate"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Without these the runner uses the migrations baked into the image at
      # build time, so a newly added .sql file is silently skipped until the
      # next `--build`. The image still carries its own copy for production.
      - ./migrations:/app/migrations:ro
      - ./backend:/app/backend:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["fastapi", "dev", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Bind mount + `fastapi dev` give reload on save. Production uses the
      # baked image and `fastapi run` (the Dockerfile's CMD) instead.
      - ./backend:/app/backend

  # A `worker` service lands here in Phase 2, when there is actually something
  # for APScheduler to schedule.

volumes:
  pgdata:
