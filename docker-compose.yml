services:
  db:
    image: postgres:17-alpine
    environment:
      # Fixed, not interpolated from .env: the volume was initialised with
      # these, and changing them in .env would leave a database whose role no
      # longer matches what the app is told to use.
      POSTGRES_DB: ipo
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: local_dev_password
    ports:
      # Published so psql and the migration runner work from the host too.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation so the shell inside the container
      # expands these, not compose.
      test: ["CMD-SHELL", "pg_isready -U ipo -d ipo"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies pending migrations, exits 0, and gates the api service.
  # Kept separate from the api container so a failed migration is a visibly
  # failed step rather than a crash loop inside the server's entrypoint.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.migrate"]
    env_file: [.env]
    environment:
      # Explicit local values, overriding anything in .env. `environment:` wins
      # over `env_file:`, and that is the point: configuring .env for a
      # production deploy must not break `docker compose up`. Putting Neon's
      # host, user and sslmode in .env did exactly that -- the local stack tried
      # to authenticate as the managed database's role and demanded TLS from a
      # container that has none.
      #
      # .env still supplies what is genuinely environment-specific: the hash
      # salt, the SEC contact, and the API keys.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ipo
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_SSLMODE: prefer
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Without these the runner uses the migrations baked into the image at
      # build time, so a newly added .sql file is silently skipped until the
      # next `--build`. The image still carries its own copy for production.
      - ./migrations:/app/migrations:ro
      - ./backend:/app/backend:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["fastapi", "dev", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      # Explicit local values, overriding anything in .env. `environment:` wins
      # over `env_file:`, and that is the point: configuring .env for a
      # production deploy must not break `docker compose up`. Putting Neon's
      # host, user and sslmode in .env did exactly that -- the local stack tried
      # to authenticate as the managed database's role and demanded TLS from a
      # container that has none.
      #
      # .env still supplies what is genuinely environment-specific: the hash
      # salt, the SEC contact, and the API keys.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ipo
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_SSLMODE: prefer
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Bind mount + `fastapi dev` give reload on save. Production uses the
      # baked image and `fastapi run` (the Dockerfile's CMD) instead.
      - ./backend:/app/backend

  # Separate process, not a thread inside the API. Ingestion spends most of its
  # time asleep against a rate limiter, and a crash in it must not take request
  # serving down. The two share only the database.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    env_file: [.env]
    environment:
      # Explicit local values, overriding anything in .env. `environment:` wins
      # over `env_file:`, and that is the point: configuring .env for a
      # production deploy must not break `docker compose up`. Putting Neon's
      # host, user and sslmode in .env did exactly that -- the local stack tried
      # to authenticate as the managed database's role and demanded TLS from a
      # container that has none.
      #
      # .env still supplies what is genuinely environment-specific: the hash
      # salt, the SEC contact, and the API keys.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ipo
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_SSLMODE: prefer
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

volumes:
  pgdata:
